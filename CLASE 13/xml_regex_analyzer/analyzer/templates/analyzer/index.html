<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XML Regex Analyzer</title>
    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'css/styles.css' %}">
</head>
<body>
    <form method="POST">
        {% csrf_token %}
        <label for="entrada">XML de entrada:</label><br>
        <textarea id="entrada" name="entrada" rows="10" cols="50">{{ entrada }}</textarea><br><br>

        <label for="salida">XML de salida:</label><br>
        <textarea id="salida" name="salida" rows="10" cols="50" readonly>{{ salida }}</textarea><br><br>

        <input type="submit" value="Procesar XML">
    </form>
</body>
</html>
